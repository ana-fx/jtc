name: Deploy to VPS

# Auto-deploy on every push to main. The job SSHes into the VPS, pulls the
# latest code, installs dependencies, (re)registers slash commands, and
# restarts the bot under PM2.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/jtc-bot
            git pull origin main
            npm ci --omit=dev
            npm run deploy
            pm2 restart jtc-voice-bot
