name: Deploy Olaf to VPS

# Auto-deploy on every push to the olaf branch of this repo. Clones/updates
# ~/olaf-bot on the VPS, installs dependencies, registers slash commands,
# and restarts under PM2. Reuses this repo's VPS secrets — same server as
# the jtc/snowy bots, just a separate deploy directory and process.
on:
  push:
    branches: [olaf]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            if [ ! -d ~/olaf-bot/.git ]; then
              git clone -b olaf https://github.com/ana-fx/jtc.git ~/olaf-bot
            fi
            cd ~/olaf-bot
            git fetch origin olaf
            git reset --hard origin/olaf
            npm ci --omit=dev
            npm run deploy
            pm2 startOrRestart ecosystem.config.cjs
            pm2 save
